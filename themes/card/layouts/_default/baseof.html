<!DOCTYPE html>
<html lang="{{ .Site.Language | default "en-us" }}">

<head>
  {{ partial "head" . }}
</head>

<body>

    {{ if not (eq .RelPermalink "404.html") }}
      <header>
        <img src="{{ .Site.Params.profile }}" />
        
        {{ with .Title }}<h1>{{ . }}</h1>{{ end }}
      </header>
    {{ end }}

    <main>{{ block "main" .  }}{{ end }}</main>

    <footer>{{ partial "footer" . }}</footer>



</body>

{{ $js := resources.Get "js/main.js" }}
{{ $script := $js | resources.Minify | resources.Fingerprint }}
<script src="{{ $script.Permalink }}"></script>

</html>
