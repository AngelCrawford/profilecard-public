<div class="circle-wrapper">
    <div class="circle" style="--m: {{ .Site.Params.linkCounter }}">
      <a href="/"><img class="header" src="{{ .Site.Params.profile }}" /></a>
      
      {{ $counter := 1 }}
      {{ range .Site.Params.links }}
        <a href="{{.url}}" target="_blank" class="tooltip" data-tooltip="{{.text}}" rel="me" aria-label="{{.text}}" data-umami-event="{{.text}}" style="--i: {{ $counter }}">
          <i class="{{.icon}} ri-xl {{ .text }}" style='color: {{.color}}; {{if .opacity}} opacity: {{.opacity}};{{end}}'></i>
        </a>
        {{ $counter = add $counter 1 }}
      {{ end }}
    </div>
</div>
