sitemap:
  ChangeFreq: "weekly"
  Priority: "0.9"

caches:
  assets:
    dir: :resourceDir/_gen
    maxAge: "800h"
  images:
    dir: :resourceDir/_gen
    maxAge: "800h"

params:
  csp:
    default        : ["'self'", "https://cloud.umami.is", "https://api-gateway.umami.dev"]
    formaction     : ["'self'"]
    framesrc       : ["'self'", "*.spotify.com", "http://spotifycdn.com"]
    imgsrc         : ["'self'"]
    objectsrc      : ["'none'"]
    stylesrc       : ["'self'", "'unsafe-inline'"]
    scriptsrc      : ["'self'", "https://cloud.umami.is", "https://api-gateway.umami.dev", "https://cloud.umami.is/script.js"]